<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07111c"><title>SLING</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111c;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{touch-action:none;overscroll-behavior:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#hud{position:fixed;inset:0;z-index:3;pointer-events:none;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start}.block{display:flex;flex-direction:column;gap:2px;text-shadow:0 3px 20px #0007}.right{align-items:flex-end}.label{font-size:9px;text-transform:uppercase;letter-spacing:.22em;font-weight:900;color:#ffffff88}.value{font-size:clamp(24px,4vw,36px);font-weight:950;letter-spacing:-.05em}#combo{font-size:13px;font-weight:900;color:#ffffffb0}#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:4;font-weight:950;font-size:clamp(21px,4vw,38px);letter-spacing:-.05em;text-shadow:0 8px 30px #0008;opacity:0;pointer-events:none}#toast.show{animation:toast .78s ease both}@keyframes toast{0%{opacity:0;transform:translate(-50%,12px) scale(.95)}25%{opacity:1;transform:translate(-50%,0) scale(1.05)}100%{opacity:0;transform:translate(-50%,-20px) scale(1)}}#tip{position:fixed;left:50%;bottom:8%;transform:translateX(-50%);z-index:3;font-size:10px;letter-spacing:.2em;font-weight:900;text-transform:uppercase;color:#ffffff88;pointer-events:none;opacity:0;transition:.3s}#tip.show{opacity:1}.screen{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 38%,#46a8ff1c,#02070e73 52%,#02070ebd);transition:opacity .35s,visibility .35s}.screen.hidden{opacity:0;visibility:hidden;pointer-events:none}.card{width:min(620px,100%);padding:clamp(28px,5vw,50px);border-radius:32px;border:1px solid #ffffff1f;background:linear-gradient(180deg,#08121f94,#040a126b);backdrop-filter:blur(24px);box-shadow:0 40px 110px #0006;text-align:center}.eyebrow{font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:#ffffff8c;font-weight:900;margin-bottom:12px}h1{font-size:clamp(70px,18vw,128px);line-height:.78;margin:0;font-weight:950;letter-spacing:-.075em}.sub{font-size:clamp(15px,2.6vw,18px);line-height:1.6;color:#ffffffbf;max-width:480px;margin:24px auto 0}.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:28px 0}.how div{border:1px solid #ffffff1a;border-radius:18px;background:#ffffff08;padding:14px 10px}.how strong{display:block;font-size:11px;margin-bottom:5px}.how span{font-size:10px;color:#ffffff8c}button{appearance:none;border:0;border-radius:999px;height:56px;padding:0 28px;background:#fff;color:#06101a;font:900 12px/1 system-ui;letter-spacing:.08em;cursor:pointer}#mini{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:6;display:flex;gap:8px}#mini button{height:40px;min-width:40px;padding:0 12px;border:1px solid #ffffff1f;background:#070e187f;color:#fff;backdrop-filter:blur(16px);font-size:10px}#result{font-size:58px;font-weight:950;letter-spacing:-.055em;margin:12px 0 2px}#meta{font-size:12px;color:#ffffff99;margin-bottom:24px}@media(max-width:560px){.how{grid-template-columns:1fr}.how div{padding:10px}.card{border-radius:26px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="block"><div class="label">Depth</div><div id="depth" class="value">0 m</div><div id="combo">×1 flow</div></div><div class="block right"><div class="label">Best</div><div id="best" class="value">0 m</div><div class="label">Lives</div><div id="lives">◆ ◆ ◆</div></div></div>
<div id="tip">tap to release</div><div id="toast">PERFECT CATCH</div>
<div id="mini"><button id="mute">SOUND</button><button id="pause">PAUSE</button></div>
<div id="start" class="screen"><div class="card"><div class="eyebrow">One tap. Pure timing.</div><h1>SLING</h1><p class="sub">Catch a ring. Orbit it. Tap to release. Fall deeper without missing the next catch.</p><div class="how"><div><strong>CATCH</strong><span>Fly into a glowing ring</span></div><div><strong>ORBIT</strong><span>You swing automatically</span></div><div><strong>RELEASE</strong><span>Tap at the right angle</span></div></div><button id="play">DROP IN</button></div></div>
<div id="over" class="screen hidden"><div class="card"><div class="eyebrow">Run over</div><div id="result">0 m</div><div id="meta">best 0 m</div><button id="again">ONE MORE GO</button></div></div>
<script>
(()=>{'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d',{alpha:false});
const D=document.getElementById('depth'),B=document.getElementById('best'),C=document.getElementById('combo'),L=document.getElementById('lives'),S=document.getElementById('start'),O=document.getElementById('over'),R=document.getElementById('result'),M=document.getElementById('meta'),T=document.getElementById('toast'),TIP=document.getElementById('tip'),MB=document.getElementById('mute'),PB=document.getElementById('pause');
let W=0,H=0,DPR=1,running=false,paused=false,last=performance.now(),t=0,cam=0,depth=0,best=+(localStorage.getItem('sling_best')||0),p,anchors=[],particles=[],stars=[],nextY=0,combo=1,chain=0,lives=3,shake=0,flash=0,muted=false,audioCtx=null;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,n)=>a+(b-a)*n,chance=q=>Math.random()<q;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,z:rand(.2,1)}))}addEventListener('resize',resize);resize();B.textContent=Math.floor(best)+' m';
function audio(){if(muted)return null;if(!audioCtx)audioCtx=new(AudioContext||webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}function tone(f,d=.08,type='sine',g=.03,slide=0){const a=audio();if(!a)return;const o=a.createOscillator(),gn=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+d);gn.gain.setValueAtTime(.0001,a.currentTime);gn.gain.exponentialRampToValueAtTime(g,a.currentTime+.01);gn.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(gn);gn.connect(a.destination);o.start();o.stop(a.currentTime+d+.02)}
function addAnchor(x,y,r,type='normal'){anchors.push({x,y,r,type,baseX:x,phase:rand(0,6.28),used:false})}function spawn(){const d=nextY/1000,margin=Math.max(80,W*.12);let r=rand(48,76),type='normal';if(d>1.5&&chance(.2)){r=rand(34,46);type='small'}if(d>2.4&&chance(.16)){r=rand(45,60);type='moving'}addAnchor(rand(margin,W-margin),nextY,r,type);nextY+=clamp(rand(210,300)+d*3,210,345)}
function burst(x,y,n,kind='catch'){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=rand(40,220);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.35,.85),size:rand(1.5,5),kind})}}function toast(s){T.textContent=s;T.classList.remove('show');void T.offsetWidth;T.classList.add('show')}
function reset(){t=0;cam=0;depth=0;combo=1;chain=0;lives=3;shake=0;flash=0;anchors=[];particles=[];p={x:W*.5,y:80,vx:0,vy:150,state:'free',anchor:null,angle:0,angVel:0,orbitR:0,grace:.65};addAnchor(W*.5,270,65);addAnchor(W*.68,540,70);nextY=790;while(nextY<H*1.8)spawn();hud()}
function startGame(){reset();running=true;paused=false;S.classList.add('hidden');O.classList.add('hidden');TIP.classList.add('show');setTimeout(()=>TIP.classList.remove('show'),2600);audio();tone(180,.25,'sine',.018,140)}
function endGame(){running=false;best=Math.max(best,depth);localStorage.setItem('sling_best',best);B.textContent=Math.floor(best)+' m';R.textContent=Math.floor(depth)+' m';M.textContent=`best ${Math.floor(best)} m • flow ×${combo}`;O.classList.remove('hidden')}
function release(){if(!running||paused||p.state!=='orbit')return;const a=p.anchor,dir=p.angVel>0?1:-1,tx=-Math.sin(p.angle)*dir,ty=Math.cos(p.angle)*dir,sp=clamp(Math.abs(p.angVel)*p.orbitR,390,730);p.vx=tx*sp;p.vy=ty*sp+80;p.state='free';p.anchor=null;p.grace=.18;tone(250,.06,'sine',.018,90);burst(p.x,p.y,8,'release')}
function input(e){if(e)e.preventDefault();release()}c.addEventListener('pointerdown',input);addEventListener('keydown',e=>{if(e.code==='Space')input(e);else if(e.code==='KeyP')pause();else if(e.code==='KeyM')mute()});document.getElementById('play').onclick=startGame;document.getElementById('again').onclick=startGame;function pause(){if(!running)return;paused=!paused;PB.textContent=paused?'RESUME':'PAUSE'}PB.onclick=e=>{e.stopPropagation();pause()};function mute(){muted=!muted;MB.textContent=muted?'MUTED':'SOUND'}MB.onclick=e=>{e.stopPropagation();mute()};
function catchTry(){if(p.state!=='free'||p.grace>0)return;let hit=null,hd=1e9;for(const a of anchors){if(a.used)continue;const d=Math.hypot(p.x-a.x,p.y-a.y);if(d<a.r+22&&d>a.r-28&&d<hd){hit=a;hd=d}}if(!hit)return;hit.used=true;p.state='orbit';p.anchor=hit;p.orbitR=clamp(hd,hit.r*.72,hit.r+18);p.angle=Math.atan2(p.y-hit.y,p.x-hit.x);const tx=-Math.sin(p.angle),ty=Math.cos(p.angle),dot=p.vx*tx+p.vy*ty,dir=dot>=0?1:-1,incoming=Math.max(360,Math.hypot(p.vx,p.vy));p.angVel=dir*clamp(incoming/p.orbitR,5,9.2);p.grace=.1;chain++;if(chain%3===0)combo=Math.min(8,combo+1);const perfect=Math.abs(hd-hit.r)<7&&incoming>430;if(perfect){depth+=22*combo;toast('PERFECT CATCH');tone(760,.1,'triangle',.025,280)}else tone(340,.09,'triangle',.025,160);burst(p.x,p.y,18,perfect?'perfect':'catch')}
function rescue(){lives--;chain=0;combo=1;shake=1;flash=1;tone(95,.22,'sawtooth',.03,-40);if(navigator.vibrate)navigator.vibrate(55);if(lives<=0){endGame();return}let cand=anchors.filter(a=>a.y<cam+H*.58).sort((a,b)=>b.y-a.y)[0];if(!cand){cand={x:W*.5,y:cam+H*.35,r:65,used:true,baseX:W*.5,phase:0,type:'normal'};anchors.push(cand)}cand.used=true;p.state='orbit';p.anchor=cand;p.orbitR=cand.r;p.angle=-Math.PI/2;p.angVel=6.1;p.x=cand.x;p.y=cand.y-p.orbitR;p.vx=p.vy=0;p.grace=.35;burst(p.x,p.y,26,'miss')}
function update(dt){if(!running||paused)return;t+=dt;p.grace=Math.max(0,p.grace-dt);shake=Math.max(0,shake-dt*6);flash=Math.max(0,flash-dt*2.5);for(const a of anchors)if(a.type==='moving')a.x=a.baseX+Math.sin(t*1.4+a.phase)*Math.min(70,W*.08);if(p.state==='orbit'){const a=p.anchor;p.angle+=p.angVel*dt;p.angVel*=1+dt*.022;p.x=a.x+Math.cos(p.angle)*p.orbitR;p.y=a.y+Math.sin(p.angle)*p.orbitR}else{p.vy+=760*dt;p.vx*=Math.pow(.985,dt*60);p.x+=p.vx*dt;p.y+=p.vy*dt;catchTry()}cam=Math.max(cam,lerp(cam,p.y-H*.34,1-Math.pow(.0015,dt)));depth=Math.max(depth,cam*.12);while(nextY<cam+H*1.7)spawn();anchors=anchors.filter(a=>a.y>cam-H*.35);const sy=p.y-cam;if(p.state==='free'&&(sy>H+120||p.x<-150||p.x>W+150)){rescue();if(!running)return}for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=Math.pow(.2,dt);q.vy*=Math.pow(.38,dt);q.life-=dt}particles=particles.filter(q=>q.life>0);hud()}
function hud(){D.textContent=Math.floor(depth)+' m';B.textContent=Math.floor(Math.max(best,depth))+' m';C.textContent='×'+combo+' flow';L.textContent=('◆ '.repeat(lives)+'◇ '.repeat(3-lives)).trim()}
function sy(y){return y-cam}function background(){const d=clamp(depth/1700,0,1),g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,`hsl(${lerp(202,265,d)},55%,${lerp(13,9,d)}%)`);g.addColorStop(.58,`hsl(${lerp(220,310,d)},50%,9%)`);g.addColorStop(1,'hsl(220,55%,4%)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='screen';for(const s of stars){const yy=(s.y+cam*.03*s.z)%H;ctx.fillStyle=`rgba(220,240,255,${.08+.3*s.z})`;ctx.beginPath();ctx.arc(s.x,yy,s.z*1.2,0,Math.PI*2);ctx.fill()}ctx.globalCompositeOperation='source-over';const sp=Math.min(1,Math.max(0,(p?.vy||0)/900));if(sp>.25){ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<34;i++){const xx=(i*97.3)%W,yy=(i*61+t*350*(.5+(i%5)*.15)*sp)%H;ctx.strokeStyle=`rgba(190,230,255,${.025+.07*sp})`;ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx,yy+25+75*sp);ctx.stroke()}ctx.restore()}}
function drawAnchor(a){const y=sy(a.y);if(y<-150||y>H+150)return;ctx.save();ctx.translate(a.x,y);const pulse=1+.035*Math.sin(t*3+a.phase),h=a.type==='moving'?285:a.type==='small'?42:190;ctx.scale(pulse,pulse);ctx.globalCompositeOperation='screen';const gl=ctx.createRadialGradient(0,0,a.r*.3,0,0,a.r*1.7);gl.addColorStop(0,`hsla(${h},95%,70%,.13)`);gl.addColorStop(1,`hsla(${h},95%,60%,0)`);ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,a.r*1.7,0,Math.PI*2);ctx.fill();ctx.shadowBlur=24;ctx.shadowColor=`hsla(${h},100%,72%,.8)`;ctx.strokeStyle=a.used?`hsla(${h},80%,70%,.25)`:`hsla(${h},95%,78%,.95)`;ctx.lineWidth=a.type==='small'?3:4;ctx.beginPath();ctx.arc(0,0,a.r,0,Math.PI*2);ctx.stroke();ctx.restore()}
function drawPlayer(){if(!p)return;const y=sy(p.y),sp=Math.hypot(p.vx,p.vy),nx=sp?p.vx/sp:0,ny=sp?p.vy/sp:1;ctx.save();ctx.translate(p.x,y);ctx.globalCompositeOperation='screen';for(let i=5;i>=1;i--){ctx.strokeStyle=`rgba(165,235,255,${.025+i*.018})`;ctx.lineWidth=i*2.7;ctx.beginPath();ctx.moveTo(-nx*5,-ny*5);ctx.lineTo(-nx*(12+i*13),-ny*(12+i*13));ctx.stroke()}const g=ctx.createRadialGradient(0,0,0,0,0,34);g.addColorStop(0,'#fff');g.addColorStop(.18,'#7eefffbb');g.addColorStop(.5,'#57a3ff38');g.addColorStop(1,'#4678ff00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,34,0,Math.PI*2);ctx.fill();ctx.shadowBlur=20;ctx.shadowColor='#b4f5ff';ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,7.5,0,Math.PI*2);ctx.fill();ctx.restore();if(p.state==='orbit'&&p.anchor){ctx.save();ctx.strokeStyle='#c0efff2d';ctx.setLineDash([4,7]);ctx.beginPath();ctx.moveTo(p.x,y);ctx.lineTo(p.anchor.x,sy(p.anchor.y));ctx.stroke();ctx.restore()}}
function drawParticles(){ctx.save();ctx.globalCompositeOperation='screen';for(const q of particles){ctx.globalAlpha=clamp(q.life/.8,0,1);ctx.fillStyle=q.kind==='miss'?'#ff5773':q.kind==='perfect'?'#fff1ab':'#80f6ff';ctx.beginPath();ctx.arc(q.x,sy(q.y),q.size,0,Math.PI*2);ctx.fill()}ctx.restore()}
function draw(){ctx.save();if(shake>0)ctx.translate(rand(-5,5)*shake,rand(-5,5)*shake);background();anchors.forEach(drawAnchor);drawParticles();drawPlayer();const vg=ctx.createRadialGradient(W*.5,H*.48,Math.min(W,H)*.18,W*.5,H*.48,Math.max(W,H)*.78);vg.addColorStop(.45,'#0000');vg.addColorStop(1,'#0008');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);if(flash>0){ctx.fillStyle=`rgba(255,64,95,${flash*.13})`;ctx.fillRect(0,0,W,H)}ctx.restore();if(paused){ctx.fillStyle='#02060a99';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 42px system-ui';ctx.fillText('PAUSED',W/2,H/2)}}
function loop(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script>
</body></html>
